{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        سفارش ثبت شد | Coffee House
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>

<main class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>


        <h1>
            سفارش شما با موفقیت ثبت شد 🎉
        </h1>


        <p>
            سفارش شما با موفقیت در سیستم ثبت شد.
        </p>


        <div class="order-code-box">

            <span>
                کد سفارش
            </span>


            <strong id="order-code">
                ---
            </strong>

        </div>


        <p>
            کد سفارش خود را نگه دارید تا بتوانید
            وضعیت سفارش را پیگیری کنید.
        </p>


        <div class="success-actions">

            <a
                href="/orders/"
                class="track-order"
            >
                پیگیری سفارش
            </a>


            <a
                href="/"
                class="back-to-menu"
            >
                بازگشت به منو
            </a>

        </div>

    </div>

</main>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const code =
        params.get("code");


    if (code) {

        document.getElementById(
            "order-code"
        ).textContent = code;

    }

</script>

</body>

</html>
