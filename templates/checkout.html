{% load static %}

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Coffee House</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<main class="checkout-page">

    <div class="checkout-container">

        <!-- ==================== Header ==================== -->

        <header class="checkout-header">
            <a href="/cart/" class="back-link">← Back to Cart</a>
            <h1>Checkout</h1>
        </header>


        <!-- ==================== Loading ==================== -->

        <div id="checkout-loading" class="checkout-loading">
            Loading order information...
        </div>


        <!-- ==================== Error ==================== -->

        <div id="checkout-error" class="checkout-error" style="display: none;">
            <p id="checkout-error-message"></p>
            <a href="/cart/" class="back-to-cart">Back to Cart</a>
        </div>


        <!-- ==================== Checkout Content ==================== -->

        <div id="checkout-content" style="display: none;">

            <!-- ==================== Order Summary ==================== -->

            <section class="checkout-section">

                <h2>Order Summary</h2>

                <div id="checkout-items" class="checkout-items">
                    <!-- محصولات توسط checkout.js از API قرار می‌گیرند -->
                </div>

                <div class="checkout-total">
                    <span>Total</span>
                    <strong id="checkout-total">0 Toman</strong>
                </div>

            </section>


            <!-- ==================== Customer Information ==================== -->

            <section class="checkout-section">

                <h2>Customer Information</h2>

                <form id="checkout-form">

                    <div class="form-group">
                        <label for="customer-name">
                            Name / Table Number
                        </label>

                        <input
                            type="text"
                            id="customer-name"
                            name="customer_name"
                            placeholder="Enter your name or table number"
                            maxlength="100"
                            required
                        >
                    </div>


                    <!-- ==================== Payment ==================== -->

                    <div class="payment-info">

                        <h3>Payment</h3>

                        <p>
                            You will be redirected to ZarinPal
                            to complete your payment securely.
                        </p>

                        <div class="payment-method">
                            <span>Payment Gateway</span>
                            <strong>ZarinPal</strong>
                        </div>

                    </div>


                    <!-- ==================== Submit ==================== -->

                    <button
                        type="submit"
                        id="payment-button"
                        class="checkout-button"
                    >
                        Proceed to Payment
                    </button>

                </form>

            </section>

        </div>

    </div>

</main>


<!-- ==================== JavaScript ==================== -->

<script src="{% static 'js/cart.js' %}"></script>
<script src="{% static 'js/checkout.js' %}"></script>

</body>

</html>
