```html
{% load static %}

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Coffee House</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>

<main class="cart-page">

    <div class="cart-container">

        <!-- =============================================
             Cart Header
        ============================================== -->

        <header class="cart-header">

            <a
                href="/"
                class="back-link"
            >
                ← Back to Menu
            </a>

            <h1>
                Your Cart
            </h1>

        </header>


        <!-- =============================================
             Loading
        ============================================== -->

        <div
            id="cart-loading"
            class="cart-loading"
        >
            Loading cart...
        </div>


        <!-- =============================================
             Products
             cart.js محصولات را از API اینجا قرار می‌دهد
        ============================================== -->

        <div
            id="cart-page-items"
            class="cart-items"
        ></div>


        <!-- =============================================
             Empty Cart
        ============================================== -->

        <section
            id="cart-empty"
            class="cart-empty"
            style="display: none;"
        >

            <div class="empty-icon">
                🛒
            </div>

            <h2>
                Your cart is empty
            </h2>

            <p>
                You haven't added any products yet.
            </p>

            <a
                href="/"
                class="back-to-menu"
            >
                Browse Menu
            </a>

        </section>


        <!-- =============================================
             Cart Summary
        ============================================== -->

        <section
            id="cart-checkout"
            class="cart-checkout"
            style="display: none;"
        >

            <div class="cart-summary">

                <div class="cart-summary-row">

                    <span>
                        Items
                    </span>

                    <strong id="page-cart-count">
                        0
                    </strong>

                </div>


                <div class="cart-summary-row total-row">

                    <span>
                        Total
                    </span>

                    <strong id="page-cart-total">
                        0 Toman
                    </strong>

                </div>

            </div>


            <!-- =============================================
                 Checkout / Payment
            ============================================== -->

            <a
                href="/checkout/"
                class="checkout-button"
            >
                Proceed to Checkout →
            </a>

        </section>

    </div>

</main>


<!-- =============================================
     Cart JavaScript
============================================== -->

<script src="{% static 'js/cart.js' %}"></script>

</body>

</html>
```
