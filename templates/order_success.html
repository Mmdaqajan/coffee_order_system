{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        سفارش ثبت شد | Coffee Shop
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>

    <main class="success-page">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>


            <h1>
                سفارش شما ثبت شد 🎉
            </h1>


            <p>
                سفارش شما با موفقیت ثبت شد.
            </p>


            <div class="order-code-box">

                <span>
                    کد سفارش
                </span>


                <strong id="order-code">
                    ---
                </strong>

            </div>


            <p class="success-status">

                وضعیت سفارش:

                <strong>
                    در انتظار بررسی
                </strong>

            </p>


            <div class="success-actions">

                <a
                    href="/"
                    class="back-to-menu"
                >
                    بازگشت به منو
                </a>


                <a
                    href="/orders/"
                    class="track-order"
                >
                    پیگیری سفارش
                </a>

            </div>

        </div>

    </main>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const orderCode =
            params.get("code");


        if (orderCode) {

            document.getElementById(
                "order-code"
            ).textContent = orderCode;

        }

    </script>

</body>

</html>
